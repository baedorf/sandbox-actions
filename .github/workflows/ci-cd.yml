name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Wähle das Ziel-Environment aus"
        type: choice
        required: true
        default: "github"
        options:
          - "github"
          - "custom"

      RELEASE_BUILD:
        description: "Create a release"
        type: boolean
        default: false
      DEPLOY:
        description: "Deploy to tailoringxpert repo"
        type: boolean
        default: false

# Verhindert, dass alte Builds Log-Speicher blockieren (Entspricht buildDiscarder)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Statische Variablen
  GIT_REPOSITORY: "tailoringexpert/platform.git"
  M2_REPO_PATH: ${{ github.workspace }}/.m2/repository

  # Bezieht Umgebungsvariablen/Secrets aus den GitHub Secrets
  GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
  GPG_SIGNKEY: ${{ secrets.GIT_GPG_SIGNKEY }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOSTURL: ${{ secrets.SONAR_HOSTURL }}

  GIT_COMMITTER_NAME: ${{ secrets.GIT_COMMITTER_NAME }}
  GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
  env:


  MAVEN_SNAPSHOTURL: ${{ vars.MAVEN_SNAPSHOTURL || secrets.MAVEN_SNAPSHOTURL}}
  MAVEN_RELEASEURL: ${{ vars.MAVEN_RELEASEURL || secrets.MAVEN_RELEASEURL }}
  MAVEN_CREDENTIALS_USR: ${{ secrets.MAVEN_CREDENTIALS_USR || github.actor}}
  MAVEN_CREDENTIALS_PSW: ${{ secrets.MAVEN_CREDENTIALS_PSW || secrets.GITHUB_TOKEN }}

  # Hier korrigiert (Typo 'CREDENDITALS' entfernt)
  DOCKER_CREDENTIALS_USR: ${{ secrets.DOCKER_CREDENTIALS_USR }}
  DOCKER_CREDENTIALS_PSW: ${{ secrets.DOCKER_CREDENTIALS_PSW }}

jobs:
  pipeline:
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.ENVIRONMENT }}
    
    permissions:
      contents: read
      packages: write

    container:
      image: ghcr.io/tailoringexpert/maven:3.9-eclipse-25
      #options: -user 1001:127
      env:
        GIT_COMMITTER_NAME: ${{ secrets.GIT_COMMITTER_NAME }}
        GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
        MAVEN_SNAPSHOTURL: ${{ env.MAVEN_SNAPSHOTURL }}
        MAVEN_RELEASEURL: ${{ env.MAVEN_RELEASEURL }}
        MAVEN_CREDENTIALS_USR: ${{ env.MAVEN_CREDENTIALS_USR }}
        MAVEN_CREDENTIALS_PSW: ${{ env.MAVEN_CREDENTIALS_PSW }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # - name: Team-Mitgliedschaft prüfen
      #   env:
      #     # Erfordert ein PAT (Personal Access Token) mit dem Recht 'read:org'
      #     GH_TOKEN: ${{ secrets.ORG_READER_TOKEN }} 
      #   run: |
      #     # Prüft, ob der auslösende User im Team "release-manager" ist
      #     if ! gh api orgs/baedorf/teams/release-manager/memberships/${{ github.actor }} --silent; then
      #       echo "::error::Nur Mitglieder des Teams 'release-manager' dürfen diesen Workflow starten."
      #       exit 1
      #     fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.RELEASE_BUILD == 'true' && 'develop' ||  github.ref_name }}
          token: ${{ env.GIT_CREDENTIALS }}
          fetch-depth: 0

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.M2_REPO_PATH }}
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG Key
        run: |
          echo "${{ env.GPG_SIGNKEY }}" | gpg --batch --import || true

      - name: Build
        run: |
          mvn --settings .jenkins/settings.xml -Dmaven.repo.local=${{ env.M2_REPO_PATH }} -DskipTests clean compile -P tailoringexpert-maven

      - name: Verify
        run: |
          mvn --settings .jenkins/settings.xml -Dmaven.repo.local=${{ env.M2_REPO_PATH }} verify -P tailoringexpert-maven

      - name: Upload JaCoCo Coverage Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/"

      - name: Quality Gate
        timeout-minutes: 60
        env:
          SONAR_TOKEN: ${{secrets.SONAR_TOKEN }}
        run: |
          mvn --settings .jenkins/settings.xml \
              -Dmaven.repo.local=${{ env.M2_REPO_PATH }}/repository \
              sonar:sonar \
              -P tailoringexpert-maven \
              -Dsonar.token=${{ env.SONAR_TOKEN }} \
              -Dsonar.host.url="https://sonar.michael-baedorf.de"

      - name: Find report-task.txt
        run: find . -name "report-task.txt"

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 60
        with:
          # Hier übergeben wir den exakten Pfad zur Datei
          scanMetadataReportFile: ./target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Install
        run: |
          mvn --settings .jenkins/settings.xml -Dmaven.repo.local=${{ env.M2_REPO_PATH }} -DskipTests install -P tailoringexpert-maven

      # Release-Vorbereitung (NUR lokal im Runner, kein ush zurück zu GitHub)
      - name: Gitflow Release (Lokaler Build & Verifizierung)
        if: ${{ github.event.inputs.RELEASE_BUILD == 'true' }}
        run: |

          # 2. Git-Sicherheit für den Container umgehen
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config --global user.name "${{ env.GIT_COMMITTER_NAME }}"
          git config --global user.email "${{ env.GIT_COMMITTER_EMAIL }}"
          git config --global commit.gpgsign true

          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2)
          git config --global user.signingkey "$GPG_KEY_ID"

          mvn --settings .jenkins/settings.xml -Dmaven.repo.local=${{ env.M2_REPO_PATH }} -B -Dresume=false -DpushChanges=false -DargLine='-DprocessAllModules --settings .jenkins/settings.xml -Dmaven.repo.local=/home/maven/.m2 --settings .jenkins/settings.xml -P tailoringexpert-maven' -DskipTestProject=true -DgpgSignTag=true -DgpgSignCommit=true gitflow:release -P tailoringexpert-maven
